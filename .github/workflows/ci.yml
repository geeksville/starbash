name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

jobs:
  test:
    # Run the test job on a matrix of OSes. Add 'windows-latest' as requested.
    # Note: if GitHub does not provide a 'windows-latest' runner this job will fail;
    # you can replace it with 'windows-2022' which is commonly available.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Temporarily disabled:
    runs-on: ${{ matrix.os }}
    environment: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      - name: Install Poetry via pip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Install Poetry directly via pip to avoid pipx path issues on Windows.
          # pipx warns about spaces in paths (e.g., "C:\Program Files (x86)\pipx_bin").
          & python -m pip install --upgrade pip
          & python -m pip install --user poetry
          # Add the user Scripts directory to PATH so poetry.exe is available
          $scriptsPath = [System.IO.Path]::Combine($env:APPDATA, "Python", "Python312", "Scripts")
          Add-Content -Path $env:GITHUB_PATH -Value $scriptsPath
          Write-Host "Added to PATH: $scriptsPath"

      #----------------------------------------------
      #       load cached venv if cache exists per https://github.com/marketplace/actions/install-poetry-action
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      # install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev

      #----------------------------------------------
      # Cache pipx installations (Linux only)
      #----------------------------------------------
      - name: Load cached pipx
        if: matrix.os == 'ubuntu-latest'
        id: cached-pipx
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/pipx
            ~/.local/bin
          key: pipx-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      #----------------------------------------------
      # Cache Flatpak installations (Linux only)
      #----------------------------------------------
      - name: Load cached Flatpak
        if: matrix.os == 'ubuntu-latest'
        id: cached-flatpak
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/flatpak
          key: flatpak-${{ matrix.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      #----------------------------------------------
      # Install linux dependencies (Linux only)
      #----------------------------------------------
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # The Qt libraries we need at runtime. PySide6's wheel bundles Qt but not
          # the system libraries Qt links against, so on a bare runner
          # `import PySide6.QtGui` dies with "libEGL.so.1: cannot open shared object
          # file". pytest-qt imports QtGui while pytest is still configuring, so
          # that aborts the entire session (INTERNALERROR) before a single test is
          # collected - even ones that never touch the GUI.
          sudo apt-get install -y --no-install-recommends flatpak pipx \
            libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            fonts-dejavu-core

      # No longer needed - because we now have a pip dependency from starbash to graxpert
      #- name: Install GraXpert (Linux)
      #  if: matrix.os == 'ubuntu-latest' && steps.cached-pipx.outputs.cache-hit != 'true'
      #  run: |
      #    pipx install graxpert[cpuonly]

      - name: Add pipx to PATH (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Siril via Flatpak (Linux)
        if: matrix.os == 'ubuntu-latest' && steps.cached-flatpak.outputs.cache-hit != 'true'
        run: |
          # Add flathub remote
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Install Siril
          flatpak install --user -y flathub org.siril.Siril
          # Let siril see /tmp
          flatpak --user override --filesystem=/tmp org.siril.Siril

      #----------------------------------------------
      # Download and install Siril (macOS/Windows only; Linux uses Flatpak above)
      #----------------------------------------------
      - name: Install Siril (macOS/Windows)
        if: matrix.os != 'ubuntu-latest'
        uses: ./.github/actions/install-siril

      - name: Show free disk space
        if: matrix.os == 'ubuntu-latest'
        run: df -h

      - name: Install Inno Setup (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Run tests
        env:
          SENTRY_ENVIRONMENT: ci
        run: poetry run pytest --cov --cov-report=term --cov-report=xml --junit-xml=pytest.xml

      - name: Install production packaging dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: poetry sync --without dev --no-interaction

      - name: Build Windows desktop installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $version = poetry version -s
          # Release build: remove diagnostics and hide the console window.
          # poetry run pyinstaller --noconfirm --clean --windowed --onedir --name Starbash `
          #   --icon src/starbash/assets/favicon.ico `
          #   --additional-hooks-dir packaging/pyinstaller `
          #   --exclude-module astropy.visualization `
          #   src/starbash/ui/qt/launcher.py
          poetry run pyinstaller --noconfirm --clean --console --debug=imports --onedir --name Starbash `
            --icon src/starbash/assets/favicon.ico `
            --additional-hooks-dir packaging/pyinstaller `
            --exclude-module astropy.visualization `
            src/starbash/ui/qt/launcher.py
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging/windows/starbash.iss

      - name: Upload Windows desktop installer
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: Starbash Windows installer
          path: dist/Starbash-Setup-*.exe
          if-no-files-found: error

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload junit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Test Results (${{ matrix.os }})
          path: pytest.xml

  upload:
    permissions:
      # Needed for EnricoMi/publish-unit-test-result-action
      checks: write
      pull-requests: write

    # Single upload job that runs after test job completes, even if tests failed
    needs: test
    if: always()
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      #----------------------------------------------
      # Publish test results 
      #----------------------------------------------
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "artifacts/**/pytest.xml"
          # check_name: CI Test Results
          comment_mode: off
          report_suite_logs: info

      # We now submit coverage only through our full integration tests
      #- name: Upload coverage to Codecov
      #  uses: codecov/codecov-action@v5
      #  with:
      #    token: ${{ secrets.CODECOV_TOKEN }}
      #    files: "artifacts/**/coverage.xml"

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: "artifacts/**/pytest.xml"
          flags: unittests