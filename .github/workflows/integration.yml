name: Integration Tests

on:
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  integration-test:
    strategy:
      # A failure on one platform must not cancel the others: each OS installs its
      # own native Siril + StarNet2 package, and those install steps are the
      # likeliest thing to need platform-specific tending.  With the default
      # fail-fast, a Windows-only breakage would cancel the Linux/macOS jobs
      # before their results could be read.
      fail-fast: false
      matrix:
        # ubuntu-latest
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    environment: ci
    env:
      # The StarNet2 CLI release every platform installs, from
      # https://starnetastro.com/cli-tools/starnet/ - pinned in one place so the
      # three per-OS URLs below cannot drift apart.  Note that the CLI is only
      # reachable through Siril 1.4.x's legacy `starnet` command, which probes
      # `starnet2 --version` for its " version:" marker (Siril's
      # starnet_executablecheck(), src/filters/starnet.c) and then passes
      # -i/-o/-m/-s/-u/-w: a CLI that changed that output, or dropped one of those
      # options, would break star removal here.
      STARNET2_VERSION: "2.6.2-0241"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Poetry (Linux/macOS)
        if: matrix.os != 'windows-latest'
        uses: snok/install-poetry@v1
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          virtualenvs-path: .venv
          installer-parallel: true

      - name: Install Poetry via pip (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Install Poetry directly via pip to avoid pipx path issues on Windows.
          # pipx warns about spaces in paths (e.g., "C:\Program Files (x86)\pipx_bin").
          & python -m pip install --upgrade pip
          & python -m pip install --user poetry
          # Add the user Scripts directory to PATH so poetry.exe is available
          $scriptsPath = [System.IO.Path]::Combine($env:APPDATA, "Python", "Python312", "Scripts")
          Add-Content -Path $env:GITHUB_PATH -Value $scriptsPath
          Write-Host "Added to PATH: $scriptsPath"

      #----------------------------------------------
      # Load cached venv if cache exists
      #----------------------------------------------
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ matrix.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      #----------------------------------------------
      # Install dependencies if cache does not exist
      #----------------------------------------------
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --with dev

      #----------------------------------------------
      # Cache pipx installations (Linux only)
      #----------------------------------------------
      - name: Load cached pipx
        if: matrix.os == 'ubuntu-latest'
        id: cached-pipx
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/pipx
            ~/.local/bin
          key: pipx-${{ matrix.os }}-${{ hashFiles('.github/workflows/integration.yml') }}

      #----------------------------------------------
      # Cache Flatpak installations (Linux only)
      #----------------------------------------------
      - name: Load cached Flatpak
        if: matrix.os == 'ubuntu-latest'
        id: cached-flatpak
        uses: actions/cache@v5
        with:
          path: |
            ~/.local/share/flatpak
          key: flatpak-${{ matrix.os }}-${{ hashFiles('.github/workflows/integration.yml') }}

      #----------------------------------------------
      # Install system dependencies (Linux only)
      #----------------------------------------------
      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # libegl1 & friends are the system libraries PySide6's wheel links against
          # but does not bundle; pytest-qt imports QtGui while pytest is still
          # configuring, so a missing one aborts the whole session with an
          # INTERNALERROR ("libEGL.so.1: cannot open shared object file").
          # Keep this list in sync with .github/workflows/ci.yml.
          sudo apt-get install -y --no-install-recommends flatpak pipx \
            libegl1 libgl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            fonts-dejavu-core

      - name: Add pipx to PATH (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Siril via Flatpak (Linux)
        if: matrix.os == 'ubuntu-latest' && steps.cached-flatpak.outputs.cache-hit != 'true'
        run: |
          # Add flathub remote
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          # Install Siril
          flatpak install --user -y flathub org.siril.Siril
          flatpak --user override --filesystem=/tmp org.siril.Siril

      #----------------------------------------------
      # Install StarNet2 (Linux only)
      #----------------------------------------------
      - name: Install StarNet2 (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # StarNet2 is a Siril plugin: the .deb drops a `starnet2` binary in
          # /usr/bin plus its shared libs and model in /usr/lib/starnet2, and Siril
          # is pointed at the binary by Starbash (see
          # src/starbash/tool/starnet.py).
          # Same steps as `just install-starnet` for the dev container.
          wget -O /tmp/starnet.deb "https://download.starnetastro.com/StarNet2_linux_${STARNET2_VERSION}_ORT_x64.deb"
          # dpkg mirrors the justfile recipe; `apt-get install -f` mops up any
          # dependencies the .deb declares that the runner is missing.
          sudo dpkg -i /tmp/starnet.deb || sudo apt-get install -f -y
          rm /tmp/starnet.deb
          # Fail loudly here (rather than in a star-removal stage later) if the
          # binary Siril looks for is not actually usable.
          command -v starnet2
          starnet2 --version

      #----------------------------------------------
      # Download and install Siril (macOS only)
      #----------------------------------------------
      - name: Download and install Siril (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Download Siril DMG.  The 1.4.4 macOS packages were rebuilt ("-3") on
          # June 26, 2026 to require macOS Ventura 13+; the un-suffixed name is stale.
          curl -L -o siril.dmg https://free-astro.org/download/siril-1.4.4-arm64-3.dmg
          # Mount the DMG
          hdiutil attach siril.dmg -nobrowse -quiet
          # Copy Siril.app to /Applications
          cp -R /Volumes/Siril*/Siril.app /Applications/
          # Unmount the DMG
          hdiutil detach /Volumes/Siril* -quiet
          # Clean up
          rm siril.dmg
          # Create symlinks to siril and siril-cli in /usr/local/bin
          sudo ln -s /Applications/Siril.app/Contents/MacOS/siril /usr/local/bin/siril
          sudo ln -s /Applications/Siril.app/Contents/MacOS/siril-cli /usr/local/bin/siril-cli

      #----------------------------------------------
      # Install StarNet2 (macOS only)
      #----------------------------------------------
      - name: Install StarNet2 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # The .pkg installs `starnet2` into /usr/local/bin, which is already on
          # the runner's PATH, with its model and CoreML/ORT runtime files under
          # /usr/local/lib/starnet2.  Siril is pointed at the binary by Starbash
          # (see src/starbash/tool/starnet.py).
          # macOS runners are Apple Silicon, so take the native CoreML build (the
          # x64/ORT one would need Rosetta); keep an Intel branch so this step
          # cannot silently break if a future image changes architecture.
          if [ "$(uname -m)" = "arm64" ]; then
            pkg="StarNet2_macos-arm64_${STARNET2_VERSION}_COREML_arm64.pkg"
          else
            pkg="StarNet2_macos-x64_${STARNET2_VERSION}_ORT_x64.pkg"
          fi
          curl -sSLf -o /tmp/starnet.pkg "https://download.starnetastro.com/${pkg}"
          # `-target /` installs it system-wide, which a .pkg needs root for.
          sudo installer -pkg /tmp/starnet.pkg -target /
          rm /tmp/starnet.pkg
          # Fail loudly here (rather than in a star-removal stage later) if the
          # binary Siril looks for is not actually usable.  Siril picks which CLI
          # dialect to speak from the `--version` output, so run its probe.
          command -v starnet2
          starnet2 --version

      #----------------------------------------------
      # Download and install Siril (Windows only)
      #----------------------------------------------
      - name: Download and install Siril (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Download Siril installer.  free-astro.org names the Windows build
          # after its MSYS2 toolchain (ucrt64), not a plain "siril-<version>-setup.exe"
          # - confirm the filename against the release page if this 404s again.
          $installer = "siril-setup.exe"
          Invoke-WebRequest -Uri "https://free-astro.org/download/siril-1.4.4-ucrt64-setup.exe" -OutFile $installer
          
          # Run installer in silent mode (Inno Setup uses /VERYSILENT /NORESTART)
          # /DIR specifies installation directory
          Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/NORESTART", "/DIR=C:\Siril" -Wait
          
          # Find where siril.exe actually is
          Write-Host "::group::Looking for siril.exe"
          $sirilExe = Get-ChildItem -Path "C:\Siril" -Filter "siril.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($sirilExe) {
            $sirilDir = $sirilExe.DirectoryName
            Write-Host "Found siril.exe at: $sirilDir"
            
            # Add actual Siril directory to PATH for this step
            $env:PATH = "$sirilDir;$env:PATH"
            
            # Add to GITHUB_PATH for subsequent steps
            Add-Content -Path $env:GITHUB_PATH -Value $sirilDir
            Write-Host "Added to PATH: $sirilDir"
            
            # Also set SIRIL_PATH environment variable as fallback
            Add-Content -Path $env:GITHUB_ENV -Value "SIRIL_PATH=$sirilDir"
          } else {
            Write-Host "ERROR: siril.exe not found!"
          }
          Write-Host "::endgroup::"
          
          # Clean up installer
          Remove-Item $installer

      #----------------------------------------------
      # Install StarNet2 (Windows only)
      #----------------------------------------------
      - name: Install StarNet2 (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The installer is Inno Setup (like Siril's), so /VERYSILENT /NORESTART
          # needs no UI.  It places the executable in
          # "C:\Program Files\StarNet2\bin", which is *not* on PATH by default -
          # so add it below: Starbash's StarnetTool looks for `starnet2` on the
          # PATH and then records that path in Siril's config
          # (see src/starbash/tool/starnet.py).
          # Built by concatenation because $env:STARNET2_VERSION_ORT... would
          # otherwise be read as one (unset) variable name.
          $version = $env:STARNET2_VERSION
          $installer = "starnet-setup.exe"
          $url = "https://download.starnetastro.com/StarNet2_win_" + $version + "_ORT_x64_setup.exe"
          Invoke-WebRequest -Uri $url -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "/VERYSILENT", "/NORESTART" -Wait -PassThru
          Remove-Item $installer
          if ($proc.ExitCode -ne 0) {
            Write-Host "ERROR: StarNet2 installer exited with code $($proc.ExitCode)"
            exit 1
          }

          # The documented location first, then the 32-bit Program Files as a
          # safety net.
          Write-Host "::group::Looking for starnet2.exe"
          $starnetExe = Get-ChildItem -Path "$env:ProgramFiles\StarNet2" -Filter "starnet2.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $starnetExe) {
            $starnetExe = Get-ChildItem -Path "C:\Program Files (x86)\StarNet2" -Filter "starnet2.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $starnetExe) {
            Write-Host "ERROR: starnet2.exe not found after install!"
            exit 1
          }
          $starnetDir = $starnetExe.DirectoryName
          Write-Host "Found starnet2.exe at: $starnetDir"
          # PATH for the rest of this job, and therefore for Starbash itself
          # (shutil.which) when the integration tests run.
          Add-Content -Path $env:GITHUB_PATH -Value $starnetDir
          $env:PATH = "$starnetDir;$env:PATH"
          Write-Host "::endgroup::"

          # Fail loudly here (rather than in a star-removal stage later) if the
          # binary Siril looks for is not actually usable.  Siril picks which CLI
          # dialect to speak from the `--version` output, so run its probe.
          & starnet2 --version

      #----------------------------------------------
      # Install crane for container image extraction (Linux only)
      #----------------------------------------------
      - name: Install crane (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Install crane for extracting container images without Docker
          curl -sL "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz" | sudo tar -xz -C /usr/local/bin crane

      #----------------------------------------------
      # Install crane for container image extraction (macOS only)
      #----------------------------------------------
      - name: Install crane (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Install crane via Homebrew (lightweight tool for working with container images)
          brew install crane

      #----------------------------------------------
      # Install crane for container image extraction (Windows only)
      #----------------------------------------------
      - name: Install crane (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Install crane for Windows
          $craneUrl = "https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Windows_x86_64.tar.gz"
          Invoke-WebRequest -Uri $craneUrl -OutFile crane.tar.gz
          tar -xzf crane.tar.gz crane.exe
          $cranePath = "$PWD"
          Move-Item crane.exe C:\Windows\System32\
          Remove-Item crane.tar.gz
          Write-Host "Installed crane to C:\Windows\System32"

      #----------------------------------------------
      # Make scratch directory (Linux only)
      #----------------------------------------------
      - name: Make scratch directory (Linux)
        if: matrix.os == 'ubuntu-latest'
        # /dev/sdb1 seems to have lots of free space
        run: sudo mkdir -p /mnt/scratch/tmp && sudo chown -R $(id -u):$(id -g) /mnt/scratch

      #----------------------------------------------
      # Extract test-data using crane (Linux)
      #----------------------------------------------
      - name: Extract test-data using crane (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "::group::Export container image to tarball using crane"
          mkdir -p /mnt/scratch
          crane export ghcr.io/geeksville/starbash/test-data:latest - | tar -xf - -C /mnt/scratch
          echo "::endgroup::"

          sudo chown -R $(id -u):$(id -g) /mnt/scratch/test-data

          echo "::group::Verify extracted data"
          ls -la /mnt/scratch/test-data
          echo "Test data extracted successfully"
          echo "::endgroup::"

      #----------------------------------------------
      # Extract test-data using crane (macOS)
      #----------------------------------------------
      - name: Extract test-data using crane (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "::group::Export container image to tarball using crane"
          crane export ghcr.io/geeksville/starbash/test-data:latest - | tar -xf - -C /tmp
          echo "::endgroup::"

          echo "::group::Verify extracted data"
          ls -la /tmp/test-data/
          echo "Test data extracted successfully"
          echo "::endgroup::"

      #----------------------------------------------
      # Extract test-data using crane (Windows)
      #----------------------------------------------
      - name: Extract test-data using crane (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "::group::Export container image to tarball using crane"
          crane export ghcr.io/geeksville/starbash/test-data:latest - | tar -xf - -C ${{ runner.temp }}
          Write-Host "::endgroup::"

          Write-Host "::group::Verify extracted data"
          Get-ChildItem "${{ runner.temp }}\test-data" | Select-Object Name, Length
          Write-Host "Test data extracted successfully"
          Write-Host "::endgroup::"

      - name: Show free disk space (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: df -h

      - name: Show free disk space (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Select-Object Name, Used, Free, @{Name="UsedGB";Expression={[math]::Round($_.Used/1GB,2)}}, @{Name="FreeGB";Expression={[math]::Round($_.Free/1GB,2)}}

      #----------------------------------------------
      # Run integration tests
      #----------------------------------------------
      - name: Run all & code-coverage tests when on Linux
        if: matrix.os == 'ubuntu-latest'
        env:
          SENTRY_ENVIRONMENT: ci
          STARBASH_TEST_DATA: /mnt/scratch/test-data
          STARBASH_LOG_DIR: /tmp
        run: TMPDIR=/mnt/scratch/tmp poetry run pytest -m integration -n 0 -v --cov --cov-report=term --cov-report=xml --junit-xml=pytest.xml

      - name: Run integration tests (macOS)
        if: matrix.os == 'macos-latest'
        env:
          SENTRY_ENVIRONMENT: ci
          STARBASH_TEST_DATA: /tmp/test-data
          STARBASH_LOG_DIR: /tmp
        run: poetry run pytest -m integration -n 0 -v --junit-xml=pytest.xml

      - name: Run integration tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SENTRY_ENVIRONMENT: ci
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          STARBASH_LOG_DIR: ${{ runner.temp }}
        run: |
          $env:STARBASH_TEST_DATA = "$env:TEMP\test-data"
          poetry run pytest -m integration -n 0 -v  --junit-xml=pytest.xml

      #----------------------------------------------
      # Post integration test log to job summary
      #----------------------------------------------
      - name: Post integration test log to job summary (Linux/macOS)
        if: always() && matrix.os != 'windows-latest'
        run: |
          if [ -f /tmp/process-auto.log ]; then
            echo "## Integration Test Log - ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Strip blank lines from the log for brevity
            grep -v '^$' /tmp/process-auto.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Integration test log not found at /tmp/process-auto.log" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post integration test log to job summary (Windows)
        if: always() && matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $logPath = "${{ runner.temp }}\process-auto.log"
          if (Test-Path $logPath) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Integration Test Log - ${{ matrix.os }}"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            # Strip blank lines from the log for brevity
            Get-Content $logPath | Where-Object { $_.Trim() -ne "" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "⚠️ Integration test log not found at $logPath"
          }

      #----------------------------------------------
      # Upload integration test logs
      #----------------------------------------------
      - name: Upload integration test logs (Linux/macOS)
        if: always() && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.os }}
          path: |
            /tmp/sb-integration.log
            /tmp/process-auto.log
          if-no-files-found: warn

      - name: Upload integration test logs (Windows)
        if: always() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: integration-logs-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/sb-integration.log
            ${{ runner.temp }}/process-auto.log
          if-no-files-found: warn

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

      - name: Upload test results to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: pytest.xml     